html{color-scheme:dark}

.toolbar input{flex:1;min-width:230px}
.toolbar select{padding:9px 12px}
.toolbar input::placeholder{color:#77869e}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:#4a86f0;box-shadow:0 0 0 3px rgba(74,134,240,.28)}
#cnt{color:var(--muted);font-size:14px;white-space:nowrap}
.copy\boxed{display:flex;gap:8px;align-items:center}
.copybox input[type=number]{width:70px;padding:9px 4px;text-align:center}

table{width:100%;border-collapse:collapse}
th{background:#1c2536;color:#fff;font-size:14px;text-align:left;padding:11px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);font-size:15.5px;vertical-align:top;line-height:1.5}
tbody tr:hover td{background:#1b222e}
td.num{color:#7f8ca1;width:54px;white-space:nowrap}
td.name{font-weight:700;min-width:240px;color:#f6f9ff}
.rate{display:inline-block;margin-left:8px;font-size:12.5px;font-weight:700;color:#ffcf5c;background:#2a2410;border:1px solid #4d4117;border-radius:6px;padding:1px 7px;white-space:nowrap;vertical-align:middle;cursor:default}

td.price{text-align:right;white-space:nowrap;font-weight:700;color:#4fd08a;width:100px}

tr.subhead td{background:#1a2130;font-size:13.5px;padding:9px 14px;border-top:none}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.cnt2{color:#8b98ad;font-weight:600;margin-left:6px}
.b-vo{background:#0f3d26;color:#5ce39a}
.b-sub{background:#12305e;color:#82b4ff}
.b-so{background:#4a3a10;color:#ffd479}
.b-en{background:#2a3140;color:#c9d2e2}
.b-na{background:#262a33;color:#9aa3b2}
.top{position:fixed;right:18px;bottom:18px;background:var(--blue);color:#fff;border-radius:999px;padding:10px 15px;font-size:14px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.empty{padding:60px 20px;text-align:center;color:#8b98ad;font-size:16px}
::-webkit-scrollbar{width:12px;height:12px}

document.getElementById('legend').innerHTML = VO.map(v => '<span class="badge ' + BC[v] + '">' + esc(label(v)) + '</span>').join('');
const toc = document.getElementById('toc');
toc.innerHTML = '<button data-g="">Все жанры</button>' + GENRES.map(([gn,c]) => '<button data-g="' + esc(gn) + '">' + esc(gn) + ' · ' + c + '</button>').join('') + SECTIONS.map(s => '<button data-g="' + s.key + '">' + esc(s.name) + ' · ' + s.rows.length + '</button>').join('');
toc.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  gEl.value = b.dataset.g; render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
function allSections(){
  const defs = [];
  for (const [gn] of GENRES) defs.push({ key: gn, name: gn, rows: DATA.filter(x => x[1] === gn) });
  for (const s of SECTIONS) defs.push({ key: s.key, name: s.name, note: s.note, rows: s.rows });
  return defs;
}
function matches(x, q, v){
  if (v !== '' && x[4] !== v) return false;
  if (q !== '' && (x[2] + ' ' + x[5]).toLowerCase().indexOf(q) < 0) return false;
  const rf = rEl.value;
  if (rf !== ''){
    const r = ratingOf(x);
    if (rf === 'any' && r === null) return false;
    if (rf === 'none' && r !== null) return false;
    if (rf !== 'any' && rf !== 'none'){
      if (r === null || r < parseFloat(rf)) return false;
    }
  }
  return true;
}
function byRatingDesc(a, b){
  const ra = ratingOf(a), rb = ratingOf(b);
  if (ra === null && rb === null) return votesOf(b) - votesOf(a);
  if (ra === null) return 1;
  if (rb === null) return -1;
  if (rb !== ra) return rb - ra;
  return votesOf(b) - votesOf(a);
}
function render(){
  const q = qEl.value.trim().toLowerCase(), g = gEl.value, v = vEl.value;
  let html = '', shown = 0, total = 0;
  for (const def of allSections()) {
    if (g && def.key !== g) continue;
    total += def.rows.length;
    let rows = def.rows.filter(x => matches(x, q, v));
    const topN = parseInt(tEl.value, 10);
    if (topN > 0){
      rows = rows.slice().sort(byRatingDesc).slice(0, topN);
    }
    if (!rows.length) continue;
    shown += rows.length;
    const groups = new Map();
    for (const x of rows) { if (!groups.has(x[4])) groups.set(x[4], []); groups.get(x[4]).push(x); }
    html += '<section><h2 class="g"><span class="bar"></span>' + esc(def.name) + (def.note ? ' <span class="note">' + esc(def.note) + '</span>' : '') + (topN > 0 ? ' <span class="note">· ТОП-' + topN + ' по рейтингу PS</span>' : '') + ' <span class="n">' + rows.length + ' игр</span></h2><div class="tablewrap"><table><thead><tr><th>Название</th><th>' + (def.note ? 'Как играть вместе' : 'Краткое описание') + '</th></tr></thead><tbody>';
    for (const vo of VO) {
      const gr = groups.get(vo); if (!gr) continue;
      html += '<tr class="subhead"><td colspan="2"><span class="badge ' + BC[vo] + '">' + esc(label(vo)) + '</span><span class="cnt2">' + gr.length + '</span></td></tr>';
      for (const x of gr) {
        html += '<tr><td class="name">' + esc(x[2]) + rateHtml(x) + '</td><td class="desc">' + esc(x[5]) + '</td></tr>';
      }
    }
    html += '</tbody></table></div></section>';
  }
  main.innerHTML = html || '<div class="empty">Ничего не найдено — измените запрос или фильтры</div>';
  cnt.textContent = 'Показано: ' + shown + ' из ' + total;
  document.querySelectorAll('.toc button').forEach(b => b.classList.toggle('on', b.dataset.g === g));
}
qEl.addEventListener('input', render);
gEl.addEventListener('change', render);
vEl.addEventListener('change', render);
rEl.addEventListener('change', render);
tEl.addEventListener('change', render);
render();

// ---------- Копирование игр ----------
const copyN = document.getElementById('copyN'), copyDesc = document.getElementById('copyDesc'), copyBtn = document.getElementById('copyBtn');
function clampN(){
  let n = parseInt(copyN.value, 10);
  if (isNaN(n)) n = 5;
  n = Math.max(1, Math.min(20, n));
  copyN.value = n;
  return n;
}
copyN.addEventListener('change', clampN);
copyN.addEventListener('input', () => { const v = parseInt(copyN.value, 10); if (v >= 1 && v <= 20) copyN.value = v; });
function filteredRows(){
  const q = qEl.value.trim().toLowerCase(), g = gEl.value, v = vEl.value;
  const topN = parseInt(tEl.value, 10);
  const out = [];
  for (const def of allSections()) {
    if (g && def.key !== g) continue;
    let rows = def.rows.filter(x => matches(x, q, v));
    if (topN > 0) rows = rows.slice().sort(byRatingDesc).slice(0, topN);
    for (const vo of VO) { for (const x of rows) { if (x[4] === vo) out.push(x); } }
  }
  return out;
}
copyBtn.addEventListener('click', async () => {
  const n = clampN();
  const rows = filteredRows().slice(0, n);
  if (!rows.length) {
    copyBtn.textContent = '✗ Нечего копировать';
    setTimeout(() => { copyBtn.textContent = '📋 Копировать'; }, 1800);
    return;
  }
  const withDesc = copyDesc.checked;
  const text = rows.map((x, i) => (i + 1) + '. ' + x[2] + (withDesc ? ' — ' + x[5] : '')).join('\n');
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    document.body.removeChild(ta);
  }
  if (ok) {
    copyBtn.classList.add('ok');
    copyBtn.textContent = '✓ Скопировано: ' + rows.length;
    setTimeout(() => { copyBtn.classList.remove('ok'); copyBtn.textContent = '📋 Копировать'; }, 2000);
  } else {
    copyBtn.textContent = '✗ Ошибка копирования';
    setTimeout(() => { copyBtn.textContent = '📋 Копировать'; }, 2000);
  }
});
</script>
</body>
